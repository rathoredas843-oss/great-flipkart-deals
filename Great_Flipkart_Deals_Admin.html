<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Great Flipkart Deals Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#172536;font:16px Arial}header{background:#cfeaff;padding:20px;text-align:center;font-size:22px;font-weight:bold;color:#123b69}main{max-width:760px;margin:24px auto;padding:0 14px}.panel{background:white;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 3px 16px #16395d14}h2{color:#123b69;margin-top:0}label{display:block;font-weight:bold;margin:13px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:80px}button{border:0;border-radius:8px;padding:12px 16px;background:#1677d2;color:white;font-weight:bold;margin:12px 6px 0 0}.secondary{background:#e7f1fc;color:#164b80}.danger{background:#b42318}.hidden{display:none}.muted{color:#64748b;font-size:13px}#status{padding:10px;background:#eef5ff;border-radius:8px;margin-top:12px;white-space:pre-wrap}.item{border:1px solid #dce5ef;border-radius:9px;padding:10px;margin:10px 0;display:flex;gap:10px;align-items:center}.item img{width:60px;height:70px;object-fit:cover}.info{flex:1;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:550px){.grid{grid-template-columns:1fr}.panel{padding:15px}}
</style></head><body><header>Great Flipkart Deals — Admin Panel</header><main>
<section class="panel" id="loginPanel"><h2>Admin Login</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Login</button><div id="loginStatus" class="muted"></div><p class="muted">Only your authorised Firebase account can manage products. Never share your password.</p></section>
<section class="panel hidden" id="appPanel"><button id="logoutBtn" class="secondary" style="float:right">Log out</button><h2 id="formTitle">Add a product</h2><form id="productForm"><input id="docId" type="hidden">
<label>Product name *</label><input id="name" required placeholder="Product name"><div class="grid"><div><label>Price (₹) *</label><input id="price" type="number" min="0" step="0.01" required placeholder="375"></div><div><label>Category *</label><input id="category" required placeholder="Fashion"></div><div><label>Brand</label><input id="brand" placeholder="Brand"></div><div><label>Colour</label><input id="colour" placeholder="Colour"></div></div>
<label>Image URL</label><input id="image" type="url" placeholder="https://..."><label>Description</label><textarea id="description"></textarea><label>EarnKaro Profit Link *</label><input id="profitLink" type="url" required placeholder="https://fktr.in/..."><button type="submit">Save product</button><button type="button" id="resetBtn" class="secondary">Clear</button></form><div id="status">Ready.</div></section>
<section class="panel hidden" id="listPanel"><h2>Manage products</h2><div id="products"></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
// Replace these placeholders with the Firebase Web App config from Project settings > General > Your apps.
const firebaseConfig={apiKey:"AIzaSyBs88H2sk23G_CHr8adHUuZ4Or0ARxBOaQ",
authDomain:"great-flipkart-deals.firebaseapp.com",
projectId:"great-flipkart-deals",
storageBucket:"great-flipkart-deals.firebasestorage.app",
messagingSenderId:"390235654375",
appId:"1:390235654375:web:128b5b63db90405c9d7a42",
measurementId:"G-EDXJDLSD5G"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let user=null;
const valid=u=>{try{return ["https:","http:"].includes(new URL(u).protocol)}catch{return false}},say=s=>$("status").textContent=s;
$("loginBtn").onclick=async()=>{try{$("loginStatus").textContent="Signing in…";await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("loginStatus").textContent="Login failed: "+e.message}};
$("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{user=u;["appPanel","listPanel"].forEach(id=>$(id).classList.toggle("hidden",!u));$("loginPanel").classList.toggle("hidden",!!u);if(u)await load()});
async function load(){say("Loading products…");try{let s=await getDocs(collection(db,"Products"));$("products").replaceChildren();if(s.empty)$("products").textContent="No products yet.";s.forEach(d=>{let p=d.data(),n=p.Name||p.name||p.title||"Untitled",row=document.createElement("div");row.className="item";let im=p.Image||p.image||p.ImageURL;if(im&&valid(im)){let i=document.createElement("img");i.src=im;row.append(i)}let info=document.createElement("div");info.className="info";let b=document.createElement("b");b.textContent=n;let small=document.createElement("div");small.className="muted";small.textContent="₹"+(p.Price||p.price||"")+" · "+(p.Category||p.Catagory||"");info.append(b,small);row.append(info);let e=document.createElement("button");e.className="secondary";e.textContent="Edit";e.onclick=()=>edit(d.id,p);let x=document.createElement("button");x.className="danger";x.textContent="Delete";x.onclick=()=>remove(d.id,n);row.append(e,x);$("products").append(row)});say("Products loaded.")}catch(e){say("Load failed: "+e.message)}}
function edit(id,p){$("docId").value=id;$("name").value=p.Name||p.name||p.title||"";$("price").value=p.Price||p.price||"";$("category").value=p.Category||p.Catagory||"";$("brand").value=p.Brand||p.brand||"";$("colour").value=p.Colour||p.Color||"";$("image").value=p.Image||p.image||p.ImageURL||"";$("description").value=p.Description||p.description||"";$("profitLink").value=p.ProfitLink||p.profitLink||p.EarnKaroLink||"";$("formTitle").textContent="Edit product";scrollTo(0,0)}
$("resetBtn").onclick=()=>{$("productForm").reset();$("docId").value="";$("formTitle").textContent="Add a product"};
$("productForm").onsubmit=async ev=>{ev.preventDefault();let link=$("profitLink").value.trim(),img=$("image").value.trim();if(!valid(link))return say("Enter a valid Profit Link.");if(img&&!valid(img))return say("Enter a valid image URL.");let data={Name:$("name").value.trim(),Price:String($("price").value),Category:$("category").value.trim(),Brand:$("brand").value.trim(),Colour:$("colour").value.trim(),Image:img,Description:$("description").value.trim(),ProfitLink:link,UpdatedAt:serverTimestamp()};try{let id=$("docId").value;if(id)await updateDoc(doc(db,"Products",id),data);else{data.CreatedAt=serverTimestamp();await addDoc(collection(db,"Products"),data)}$("productForm").reset();$("docId").value="";$("formTitle").textContent="Add a product";say(id?"Product updated.":"Product added.");await load()}catch(e){say("Save failed: "+e.message+" Check Firestore Rules and admin UID.")}};
async function remove(id,name){if(!confirm('Delete "'+name+'"?'))return;try{await deleteDoc(doc(db,"Products",id));say("Product deleted.");await load()}catch(e){say("Delete failed: "+e.message)}}
</script></body></html>
