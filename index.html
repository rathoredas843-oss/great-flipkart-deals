<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Great Flipkart Deals</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#222}
header{background:#2874f0;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:25px}
.search{padding:15px;background:white}
.search input{width:100%;padding:13px;border:1px solid #ccc;border-radius:6px;font-size:16px}
nav{display:flex;justify-content:center;gap:20px;background:white;padding:14px;flex-wrap:wrap}
nav a{color:#2874f0;text-decoration:none;font-weight:bold}
.banner{background:#172b68;color:white;text-align:center;padding:35px 15px}
.banner h2{font-size:27px;margin:0 0 10px}
main{padding:18px;max-width:1100px;margin:auto}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}
.filters button{border:1px solid #2874f0;background:white;color:#2874f0;padding:9px 14px;border-radius:20px;cursor:pointer}
.filters button.active{background:#2874f0;color:white}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:white;border-radius:9px;padding:15px;text-align:center;box-shadow:0 2px 7px #0001}
.product-image{height:160px;background:#edf3ff;display:flex;align-items:center;justify-content:center;border-radius:7px;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:contain}
.card h3{font-size:19px}
.price{font-size:22px;color:#087b36;font-weight:bold}
.note{font-size:13px;color:#666}
.buy{display:block;background:#fb641b;color:white;padding:12px;border-radius:5px;text-decoration:none;font-weight:bold;margin-top:14px}
.buy.disabled{background:#999}
.status{text-align:center;padding:20px;color:#555}
footer{text-align:center;padding:22px;background:#172b68;color:white;margin-top:30px}
</style>
</head>

<body>
<header>
<h1>Great Flipkart Deals</h1>
<p>Find great products at great prices!</p>
</header>

<div class="search">
<input type="search" id="search" placeholder="Search products...">
</div>

<nav>
<a href="#">Home</a>
<a href="#products">Products</a>
<a href="#about">About Us</a>
</nav>

<section class="banner">
<h2>Welcome to Great Flipkart Deals</h2>
<p>Discover amazing shopping deals!</p>
</section>

<main id="products">
<h2>Featured Products</h2>

<div class="filters" id="categories">
<button class="active" data-category="All">All</button>
</div>

<div class="products" id="productList">
<p class="status">Loading products...</p>
</div>
</main>

<footer id="about">
<h3>Great Flipkart Deals</h3>
<p>Smart shopping starts here.</p>
<p class="note">We may earn a commission from qualifying purchases.</p>
</footer>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import { getFirestore, collection, getDocs }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBs88H2sk23G_CHr8adHUuZ4Or0ARxBOaQ",
  authDomain: "great-flipkart-deals.firebaseapp.com",
  projectId: "great-flipkart-deals",
  storageBucket: "great-flipkart-deals.firebasestorage.app",
  messagingSenderId: "390235654375",
  appId: "1:390235654375:web:128b5b63db90405c9d7a42",
  measurementId: "G-EDXJDLSD5G"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];
let selectedCategory = "All";

function getValue(item, names) {
  for (const name of names) {
    if (item[name] !== undefined && item[name] !== null &&
        String(item[name]).trim() !== "") {
      return item[name];
    }
  }
  return "";
}

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[char]);
}

function validImage(url) {
  try {
    const parsed = new URL(url);
    return ["https:", "http:"].includes(parsed.protocol);
  } catch {
    return false;
  }
}

function renderCategories() {
  const categories = [...new Set(
    products.map(p => getValue(p.data,
      ["Category","Catagory","category","categoryName"]
    )).filter(Boolean).map(String)
  )];

  const box = document.getElementById("categories");
  box.innerHTML = "";

  ["All", ...categories].forEach(category => {
    const button = document.createElement("button");
    button.textContent = category;
    button.className = selectedCategory === category ? "active" : "";
    button.dataset.category = category;
    button.addEventListener("click", () => {
      selectedCategory = category;
      renderCategories();
      renderProducts();
    });
    box.appendChild(button);
  });
}

function renderProducts() {
  const query = document.getElementById("search").value.toLowerCase();

  const filtered = products.filter(product => {
    const data = product.data;
    const category = String(getValue(data,
      ["Category","Catagory","category","categoryName"]
    ) || "");

    const matchesCategory = selectedCategory === "All" ||
      category.toLowerCase() === selectedCategory.toLowerCase();

    const matchesSearch = JSON.stringify(data)
      .toLowerCase().includes(query);

    return matchesCategory && matchesSearch;
  });

  const list = document.getElementById("productList");

  if (!filtered.length) {
    list.innerHTML = '<p class="status">No products found.</p>';
    return;
  }

  list.innerHTML = filtered.map(product => {
    const data = product.data;
    const name = getValue(data, ["Name","name","ProductName","title"]) || "Product";
    const price = getValue(data, ["Price","price","SellingPrice"]);
    const description = getValue(data, ["Description","description"]);
    const brand = getValue(data, ["Brand","brand"]);
    const colour = getValue(data, ["Colour","Color","colour"]);
    const ram = getValue(data, ["Ram","RAM","ram"]);
    const storage = getValue(data, ["Storage","storage"]);
    const image = getValue(data, ["Image","image","ImageURL","imageUrl","ProductImage"]);
    const profitLink = getValue(data, ["ProfitLink","profitLink","EarnKaroLink","earnKaroLink","AffiliateLink","affiliateLink"]);
    const category = getValue(data, ["Category","Catagory","category"]);

    const specs = [brand, ram, storage, colour].filter(Boolean).join(" | ");
    const imageHTML = validImage(String(image))
      ? `<img src="${safeText(image)}" alt="${safeText(name)}" loading="lazy">`
      : '<span style="font-size:60px">🛍️</span>';

    const buyHTML = profitLink && validImage(String(profitLink))
      ? `<a class="buy" href="${safeText(profitLink)}" target="_blank" rel="noopener noreferrer">Buy Now</a>`
      : '<span class="buy disabled">Link coming soon</span>';

    return `
      <div class="card">
        <div class="product-image">${imageHTML}</div>
        <h3>${safeText(name)}</h3>
        <p>${safeText(description)}</p>
        <p class="price">${price !== "" ? "₹" + safeText(price) : "Price unavailable"}</p>
        <p class="note">${safeText(specs)}</p>
        <p class="note">${safeText(category)}</p>
        ${buyHTML}
      </div>
    `;
  }).join("");
}

async function loadProducts() {
  const list = document.getElementById("productList");

  try {
    const snapshot = await getDocs(collection(db, "Products"));

    products = snapshot.docs.map(doc => ({
      id: doc.id,
      data: doc.data()
    }));

    renderCategories();
    renderProducts();

  } catch (error) {
    console.error("Firebase error:", error);
    list.innerHTML =
      '<p class="status">Unable to load products. Please try again later.</p>';
  }
}

document.getElementById("search").addEventListener("input", renderProducts);

loadProducts();
</script>
</body>
</html>
